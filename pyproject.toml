[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deskbridge"
version = "0.1.0"
description = "Safe Mac desktop control for OpenClaw — local web console + CLI + agent skill"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "DeskBridge Contributors" }
]
keywords = ["openclaw", "macos", "desktop", "agent", "fastapi", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: MacOS X",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[project.scripts]
deskbridge = "deskbridge.cli:main"

[project.urls]
Homepage = "https://github.com/gowtham980/deskbridge"
Repository = "https://github.com/gowtham980/deskbridge"
Issues = "https://github.com/gowtham980/deskbridge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deskbridge = [
  "web/templates/*.html",
  "web/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
